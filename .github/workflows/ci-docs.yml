name: CI - Docs

on:
  push:
    paths-ignore:
      - 'data/**'
      - 'tests/**'
  pull_request:
    paths-ignore:
      - 'data/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  docs:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-action

      - run: bin/console lint:docs
